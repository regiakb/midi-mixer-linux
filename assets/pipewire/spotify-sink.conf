# Virtual sink for Spotify (audio-midi-controller).
#
# Spotify resets its own stream volume to 100% on every track change. The
# controller routes Spotify's stream into this loopback sink and controls the
# sink's volume instead (config.json slot "sink:spotify_sink"), so the reset
# never reaches the audible output.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and restart PipeWire:
#   systemctl --user restart pipewire
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Spotify"
      capture.props = {
        node.name        = "spotify_sink"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name        = "spotify_sink_playback"
        node.passive     = true
        audio.position   = [ FL FR ]
        # No target.object: follows the default output sink.
      }
    }
  }
]
